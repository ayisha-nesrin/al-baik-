<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Albake Bytes Cafe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand" id="brand">Albake <span>Bytes</span> Cafe</div></header>
  <main>
    <div class="ticket">
      <div class="grow">
        <div class="lbl">Delivering to</div>
        <div class="seat" id="seatLbl">Choose your seat</div>
        <div class="muted" style="font-size:13px">Food comes to your seat in about 10 minutes. Enjoy the film.</div>
      </div>
      <button id="changeSeat">Change</button>
    </div>
    <div class="mine" id="mine"></div>
    <input id="search" class="search" type="search" placeholder="Search snacks, coffee, drinks…" aria-label="Search the menu">
    <nav class="rail" id="rail" aria-label="Categories"></nav>
    <div id="menu"><p class="muted">Loading menu…</p></div>
  </main>
</div>
<div class="bar" id="bar" hidden><button id="openCart"><span id="barCount">0 items</span><span>View order →</span></button></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
const $=s=>document.getElementById(s);
const rs=n=>"₹"+Number(n).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ITEMS={},CATS=[],FEE=20,GST=.05,PAYS=["UPI","Card","Cash"],cart=store.get("cart",{});
const PAY_LABEL={Online:"Pay now (UPI / Card)",UPI:"UPI at seat",Card:"Card at seat",Cash:"Cash at seat"};
let seat=parseSeat()||store.get("seat",null);
function parseSeat(){const q=new URLSearchParams(location.search).get("seat")||location.hash.slice(1);
  const m=/^S(\d+)-([A-Za-z]{1,2})(\d+)$/.exec(q||"");return m?{screen:m[1],row:m[2].toUpperCase(),num:m[3]}:null}
if(seat)store.set("seat",seat);
const seatText=s=>`Screen ${s.screen} · ${s.row}${s.num}`;
const saveCart=()=>store.set("cart",cart);

async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong. Try again.");return j}

async function loadMenu(){
  try{const m=await api("/api/menu");setBrand(m.cafeName);FEE=m.fee;GST=m.gstRate;PAYS=m.payments||PAYS;ITEMS={};CATS=[];
    m.items.forEach(i=>{ITEMS[i.id]=i;if(!CATS.includes(i.category))CATS.push(i.category)});
    for(const k in cart)if(!ITEMS[k]||!ITEMS[k].available)delete cart[k];
    renderMenu();updateBar()}
  catch(e){$("menu").innerHTML=`<p class="muted">Couldn't load the menu. Check your connection and refresh.</p>`}}
function renderMenu(){
  $("rail").innerHTML=CATS.map((c,i)=>`<button data-c="${i}" class="${i?"":"on"}">${esc(c)}</button>`).join("");
  const q=$("search").value.trim().toLowerCase();$("rail").hidden=!!q;
  $("menu").innerHTML=CATS.map((c,i)=>{const list=Object.values(ITEMS).filter(x=>x.category===c&&(!q||(x.name+" "+(x.description||"")+" "+c).toLowerCase().includes(q)));
    return list.length?`<section id="cat${i}"><h2>${esc(c)}</h2><div class="grid">${list.map(x=>card(x.id)).join("")}</div></section>`:""}).join("")
    ||(q?`<p class="muted">Nothing matches "${esc(q)}".</p>`:`<p class="muted">The menu is being updated. Please check back in a minute.</p>`)}
function setBrand(n){if(!n)return;document.title=n;const w=n.split(" ");$("brand").innerHTML=w.length>2?`${esc(w[0])} <span>${esc(w.slice(1,-1).join(" "))}</span> ${esc(w.at(-1))}`:w.length===2?`${esc(w[0])} <span>${esc(w[1])}</span>`:esc(n)}
$("search").addEventListener("input",()=>renderMenu());
function card(id){const i=ITEMS[id],q=cart[id]||0;
  const right=!i.available?`<span class="soldout">Sold out</span>`:q?`<div class="qty"><button data-m="${id}" aria-label="Remove one">−</button><span class="c">${q}</span><button data-p="${id}" aria-label="Add one">+</button></div>`:`<button class="add" data-p="${id}">ADD</button>`;
  return `<div class="item ${i.available?"":"out"}" data-id="${id}" role="button" tabindex="0" aria-label="Add ${esc(i.name)}">${i.photo?`<img class="ph" src="${i.photo}" alt="" loading="lazy">`:`<div class="emo">${i.emoji||"🍽️"}</div>`}<div class="t"><div class="n">${i.veg?'<span class="veg" title="Vegetarian"></span>':""}${esc(i.name)}</div><div class="d">${esc(i.description||"")}</div><div class="p">${rs(i.price)}</div></div>${right}</div>`}
function refreshItem(id){const el=document.querySelector(`.item[data-id="${id}"]`);if(el)el.outerHTML=card(id);updateBar()}
function change(id,d){if(!ITEMS[id]?.available)return;cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];saveCart();refreshItem(id)}
function totals(){let n=0,s=0;for(const k in cart){n+=cart[k];s+=cart[k]*ITEMS[k].price}const fee=s?FEE:0,gst=Math.round(s*GST);return{n,s,fee,gst,t:s+fee+gst}}
function updateBar(){const t=totals();$("bar").hidden=!t.n;$("barCount").textContent=`${t.n} item${t.n>1?"s":""} · ${rs(t.s)}`}
function renderSeat(){$("seatLbl").textContent=seat?seatText(seat):"Choose your seat"}

$("menu").addEventListener("click",e=>{const p=e.target.closest("[data-p]"),m=e.target.closest("[data-m]");
  if(p)return change(p.dataset.p,1);if(m)return change(m.dataset.m,-1);
  const it=e.target.closest(".item");if(it&&!cart[it.dataset.id])change(it.dataset.id,1)});
$("menu").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("item")){e.preventDefault();change(e.target.dataset.id,1)}});
$("rail").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#rail button").forEach(x=>x.classList.toggle("on",x===b));
  $("cat"+b.dataset.c).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})});

function openSheet(h){$("panel").innerHTML=h;$("sheet").hidden=false}
function closeSheet(){$("sheet").hidden=true;stopTrack()}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function seatForm(){const s=seat||{screen:"",row:"",num:""};return `<div class="fields">
 <div><label class="f" for="fS">Screen</label><input id="fS" inputmode="numeric" value="${esc(s.screen)}"></div>
 <div><label class="f" for="fR">Row</label><input id="fR" maxlength="2" value="${esc(s.row)}"></div>
 <div><label class="f" for="fN">Seat no.</label><input id="fN" inputmode="numeric" value="${esc(s.num)}"></div></div>`}
function readSeat(){const s={screen:$("fS").value.trim(),row:$("fR").value.trim().toUpperCase(),num:$("fN").value.trim()};
  return /^\d{1,2}$/.test(s.screen)&&/^[A-Z]{1,2}$/.test(s.row)&&/^\d{1,3}$/.test(s.num)?s:null}
$("changeSeat").onclick=()=>{openSheet(`<h3>Your seat</h3><p class="muted" style="margin:0">Check your ticket for screen, row and seat number.</p>${seatForm()}<div class="err" id="err"></div><button class="primary" id="saveSeat">Save seat</button>`);
  $("saveSeat").onclick=()=>{const s=readSeat();if(!s){$("err").textContent="Enter a screen number, a row letter and a seat number.";return}seat=s;store.set("seat",s);renderSeat();closeSheet()}};

$("openCart").onclick=showCart;
function showCart(){const t=totals();if(!t.n)return closeSheet();
  openSheet(`<h3>Your order</h3>${Object.keys(cart).map(k=>`<div class="row"><span class="nm">${ITEMS[k].emoji||""} ${esc(ITEMS[k].name)}</span><div class="qty"><button data-cm="${k}" aria-label="Remove one">−</button><span class="c">${cart[k]}</span><button data-cp="${k}" aria-label="Add one">+</button></div><span style="min-width:64px;text-align:right;font-variant-numeric:tabular-nums">${rs(cart[k]*ITEMS[k].price)}</span></div>`).join("")}
  <div style="margin-top:10px"><div class="tot"><span>Items</span><span>${rs(t.s)}</span></div><div class="tot"><span>Seat delivery</span><span>${rs(t.fee)}</span></div><div class="tot"><span>GST ${Math.round(GST*100)}%</span><span>${rs(t.gst)}</span></div><div class="tot big"><span>Total</span><span>${rs(t.t)}</span></div></div>
  <label class="f">Deliver to</label>${seatForm()}
  <label class="f" for="fNote">Note for the cafe (optional)</label><input id="fNote" maxlength="200" placeholder="Less ice, no onions…">
  <label class="f">Payment</label><div class="pay">${PAYS.map((p,i)=>`<label><input type="radio" name="pay" value="${p}" ${i?"":"checked"}> ${PAY_LABEL[p]}</label>`).join("")}</div>
  <div class="err" id="err"></div><button class="primary" id="place">Place order · ${rs(t.t)}</button><button class="ghost" id="keep">Add more items</button>`);
  $("panel").onclick=e=>{const p=e.target.closest("[data-cp]"),m=e.target.closest("[data-cm]");if(p){change(p.dataset.cp,1);showCart()}if(m){change(m.dataset.cm,-1);showCart()}};
  $("keep").onclick=closeSheet;$("place").onclick=place}

async function place(){const s=readSeat();if(!s){$("err").textContent="Enter a valid screen, row and seat so we can find you.";return}
  const btn=$("place"),payment=document.querySelector('[name=pay]:checked').value;btn.disabled=true;btn.textContent="Placing order…";
  try{const o=await api("/api/orders",{method:"POST",body:JSON.stringify({seat:s,items:cart,payment,note:$("fNote").value.trim()})});
    seat=s;store.set("seat",s);renderSeat();
    if(o.razorpay)return payOnline(o,btn);
    orderDone(o)}
  catch(e){$("err").textContent=e.message;btn.disabled=false;btn.textContent="Try again";loadMenu()}}
function orderDone(o){cart={};saveCart();renderMenu();updateBar();
  const mine=store.get("myOrders",[]);if(!mine.includes(o.id))mine.unshift(o.id);store.set("myOrders",mine.slice(0,5));
  showTrack(o);loadMine()}
function payOnline(o,btn){
  if(!window.Razorpay){$("err").textContent="The payment window didn't load. Check your connection, or choose pay at seat.";btn.disabled=false;btn.textContent="Try again";return}
  const rp=o.razorpay;
  const rzp=new Razorpay({key:rp.key,order_id:rp.orderId,amount:rp.amount,currency:rp.currency,name:rp.name,
    description:`Order ${o.id} · ${seatText(o.seat)}`,theme:{color:"#c2185b"},
    notes:{seat:seatText(o.seat)},
    handler:async r=>{btn.textContent="Confirming payment…";
      try{orderDone(await api(`/api/orders/${o.id}/verify`,{method:"POST",body:JSON.stringify(r)}))}
      catch(e){$("err").textContent=e.message+` (Order ${o.id})`;btn.disabled=false;btn.textContent="Try again"}},
    modal:{ondismiss:()=>paymentCancelled(o,btn)}});
  rzp.on("payment.failed",r=>{$("err").textContent="Payment failed: "+(r.error?.description||"please try again")+"."});
  rzp.open()}
function paymentCancelled(o,btn){
  btn.disabled=false;btn.textContent="Pay now · "+rs(o.total);btn.onclick=()=>{btn.disabled=true;payOnline(o,btn)};
  const seatPays=PAYS.filter(p=>p!=="Online");
  $("err").innerHTML=`Payment not completed. Your order hasn't been sent yet.`+(seatPays.length?` <button class="add" id="seatPay" style="margin-left:6px">Pay at seat instead</button>`:"");
  if(seatPays.length)$("seatPay").onclick=async()=>{try{orderDone(await api(`/api/orders/${o.id}/pay-at-seat`,{method:"POST",body:JSON.stringify({payment:seatPays[0]})}))}catch(e){$("err").textContent=e.message}}}

const STEP={"Preparing":1,"On the way":2,"Delivered":3};
let tracker=null;
function stopTrack(){clearInterval(tracker);tracker=null}
function showTrack(o){
  const n=STEP[o.status]||0,cancelled=o.status==="Cancelled";
  openSheet(`<div class="done"><div class="muted">${cancelled?"Order cancelled":"Order placed"}</div><div class="big">${o.id}</div>
  <p>Delivering to <b>${seatText(o.seat)}</b> · ${rs(o.total)} · ${o.paymentStatus==="Paid"?"<b>Paid online ✓</b>":"pay by "+esc(o.payment)+" at your seat"}</p>
  <div class="steps">${[1,2,3].map(i=>`<div class="${i<=n?"on":""}"></div>`).join("")}</div>
  <div class="muted" style="display:flex;justify-content:space-between;font-size:12px"><span>Preparing</span><span>On the way</span><span>At your seat</span></div>
  <p class="muted" style="font-size:13px">${cancelled?"Please call a staff member if you need help.":"This screen updates by itself. Please keep your phone on silent."}</p>
  <button class="primary" id="ok">Back to menu</button></div>`);
  $("ok").onclick=closeSheet;
  if(!tracker&&!cancelled&&o.status!=="Delivered")tracker=setInterval(async()=>{try{const u=await api("/api/orders/"+o.id);if(u.status!==o.status){o=u;stopTrack();showTrack(u);loadMine()}}catch(e){}},8000)}

async function loadMine(){const ids=store.get("myOrders",[]);const out=[];
  for(const id of ids){try{const o=await api("/api/orders/"+id);if(o.status!=="Awaiting payment"&&Date.now()-o.createdAt<1000*60*60*4)out.push(o)}catch(e){}}
  $("mine").innerHTML=out.map(o=>`<div class="card"><span><b>${o.id}</b> · ${o.items.map(i=>i.qty+"× "+esc(i.name)).join(", ")}</span><span class="pill">${o.status}</span><button class="add" data-track="${o.id}">Track</button></div>`).join("");}
$("mine").addEventListener("click",async e=>{const b=e.target.closest("[data-track]");if(b)showTrack(await api("/api/orders/"+b.dataset.track))});

renderSeat();loadMenu();loadMine();setInterval(loadMine,30000);
setInterval(()=>{if($("sheet").hidden&&!$("search").value)loadMenu()},60000);
if(!seat)$("changeSeat").click();
</script>
</body>
</html>
